name: ClubEngine Windows Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: true
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/ClubEngine.exe dist/
          Compress-Archive -Path dist/* -DestinationPath ClubEngine-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ClubEngine-Windows-x64
          path: ClubEngine-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
